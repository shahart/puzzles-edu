name: Go

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build
        working-directory: ./go
        run: go build -v ./...
      - name: Test
        working-directory: ./go
        run: go test -v ./...
      - name: Test with race
        working-directory: ./go
        run: go test -race -v ./...
      # - name: Run
      #   working-directory: ./go
      #   run: go run main.go 
